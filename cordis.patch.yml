# dsh-header-masq layer.
#
# Mounts the host plugin. The plugin exposes a DSH session id to gateways that
# expect a harness-specific session header.
#
# The canonical value is the durable `GenerateOptions.sessionId` of the model
# call: every request of one Session uses the same value, and a new Session
# uses a new one. `@deepseek-ai/dsh-llm-deepseek` also sends that value as
# `x-deepseek-harness-session-id`; `@deepseek-ai/dsh-llm-pi-ai` (custom /
# third-party model providers) does not. The source header is therefore the
# fallback for calls that have no live session id.
#
# Row config (all optional):
#   source:               header to read when no live session id exists.
#                         Defaults to x-deepseek-harness-session-id.
#   targets:              headers to set. Defaults to [x-opencode-session].
#   fallbackToSessionId:  use the model call's sessionId as the canonical
#                         fixed value. Defaults to true.
#   hosts:                optional host allow-list (e.g. [opencode.ai]).
#                         Empty means every host.
#   debug:                true logs every applied mapping.
- insert:
    - id: header-masq
      name: dsh-header-masq
      config:
        source: x-deepseek-harness-session-id
        targets:
          - x-opencode-session
        fallbackToSessionId: true
        debug: false

# dsh-header-masq layer.
#
# Mounts the host plugin. The plugin exposes a DSH session id to gateways that
# expect a harness-specific session header.
#
# Why the fallback exists: `@deepseek-ai/dsh-llm-deepseek` sends
# `x-deepseek-harness-session-id`, but `@deepseek-ai/dsh-llm-pi-ai` — the
# adapter used by custom / third-party model providers — does not implement the
# DeepSeek wire extensions at all. For those routes the plugin reads the live
# `GenerateOptions.sessionId` from the `llm/stream` waterfall instead.
#
# Row config (all optional):
#   source:               header to read first. Defaults to
#                         x-deepseek-harness-session-id.
#   targets:              headers to set. Defaults to [x-opencode-session].
#   fallbackToSessionId:  when the source header is absent, use the model
#                         call's sessionId. Defaults to true.
#   hosts:                optional host allow-list for the fallback (e.g.
#                         [opencode.ai]). Empty means every host.
#   debug:                true logs every applied mapping.
- insert:
    - id: header-masq
      name: dsh-header-masq
      config:
        source: x-deepseek-harness-session-id
        targets:
          - x-opencode-session
        fallbackToSessionId: true
        debug: false
